# conventions.example.yaml — Example pattern registry for scout
#
# Copy this file to conventions.yaml at the root of your indexed project.
# The indexer reads it and loads conventions into the database so
# get_conventions can return documented patterns with concrete examples.
#
# Fields:
#   name:        Unique slug for the pattern
#   terms:       Search terms that should trigger this convention
#   description: What the pattern is and WHY it exists
#   structure:   Pseudocode showing the repeating shape
#   examples:    Symbol IDs from your codebase (suffix is fine — fuzzy-matched)

- name: repository-pattern
  terms:
    - repository
    - data access
    - persistence
    - database
    - store
  description: |
    All database access goes through a Repository interface. Callers depend on
    the interface, not the concrete implementation. This keeps business logic
    testable without a real database and allows the storage backend to be
    swapped independently.
  structure: |
    type Repository interface {
        FindByID(ctx context.Context, id string) (*Entity, error)
        Insert(ctx context.Context, e *Entity) (*Entity, error)
        Update(ctx context.Context, e *Entity) (*Entity, error)
        Delete(ctx context.Context, id string) error
        List(ctx context.Context, params ListParams) ([]*Entity, error)
    }

    // Implementation lives in a separate package and is injected at startup.
    type sqlRepository struct{ db *sql.DB }
    func (r *sqlRepository) FindByID(ctx context.Context, id string) (*Entity, error) { ... }
  examples:
    - yourpkg.Repository
    - yourpkg.NewSQLRepository

- name: grpc-handler
  terms:
    - rpc
    - handler
    - service method
    - grpc
    - endpoint
  description: |
    All gRPC methods follow a consistent structure:
    1. Validate required fields
    2. Parse resource names from the request
    3. Execute business logic (inside a transaction where writes are involved)
    4. Return the result proto
  structure: |
    func (s *Server) CreateResource(ctx context.Context, req *pb.CreateResourceRequest) (*pb.Resource, error) {
        if err := validate(req); err != nil {
            return nil, status.Errorf(codes.InvalidArgument, "invalid request: %v", err)
        }
        result, err := s.repo.Insert(ctx, toModel(req.GetResource()))
        if err != nil {
            return nil, status.Errorf(codes.Internal, "insert: %v", err)
        }
        return toProto(result), nil
    }
  examples:
    - yourpkg.Server.CreateResource
    - yourpkg.Server.GetResource

- name: pagination
  terms:
    - pagination
    - page token
    - page size
    - list
    - cursor
  description: |
    List RPCs use cursor-based pagination. ParsePaginationOpts validates
    page_size (default 50, max 500) and decodes the page token into an offset.
    NextPageToken encodes the next cursor only when more results exist.
  structure: |
    opts, err := pagination.Parse(req.GetPageSize(), req.GetPageToken())
    if err != nil {
        return nil, status.Errorf(codes.InvalidArgument, "invalid page token: %v", err)
    }
    items, hasMore, err := s.repo.List(ctx, ListParams{
        Limit:  opts.PageSize,
        Cursor: opts.Cursor,
    })
    return &pb.ListResponse{
        Items:         toProtos(items),
        NextPageToken: pagination.NextToken(hasMore, items),
    }, nil
  examples:
    - yourpkg.Server.ListResources

- name: error-handling
  terms:
    - error handling
    - status code
    - grpc error
    - error wrapping
    - sentinel error
  description: |
    Errors are mapped to gRPC status codes at the boundary (the handler).
    Internal packages return plain Go errors or typed sentinel errors.
    Handlers convert them to status.Errorf calls. This keeps domain code free
    of gRPC imports and makes error intent explicit at the call site.
  structure: |
    // Domain package: plain errors
    var ErrNotFound = errors.New("not found")
    var ErrConflict = errors.New("conflict")

    // Handler: map to status codes
    switch {
    case errors.Is(err, repo.ErrNotFound):
        return nil, status.Errorf(codes.NotFound, "resource not found")
    case errors.Is(err, repo.ErrConflict):
        return nil, status.Errorf(codes.AlreadyExists, "resource already exists")
    default:
        return nil, status.Errorf(codes.Internal, "unexpected error: %v", err)
    }
  examples:
    - yourpkg.ErrNotFound
    - yourpkg.Server.CreateResource

- name: testing
  terms:
    - test
    - testing
    - fixture
    - integration test
    - table driven
  description: |
    Tests are table-driven, call t.Parallel(), and use t.Context(). Integration
    tests share a fixture that brings up real dependencies (database, external
    services) once per package via TestMain, then run subtests in parallel.
  structure: |
    func TestCreateResource(t *testing.T) {
        t.Parallel()
        tests := []struct {
            name    string
            req     *pb.CreateResourceRequest
            wantErr codes.Code
        }{
            {name: "ok", req: validReq(), wantErr: codes.OK},
            {name: "missing name", req: &pb.CreateResourceRequest{}, wantErr: codes.InvalidArgument},
        }
        for _, tc := range tests {
            t.Run(tc.name, func(t *testing.T) {
                t.Parallel()
                ctx := t.Context()
                fx := newFixture(t)
                _, err := fx.server.CreateResource(ctx, tc.req)
                assert.Equal(t, status.Code(err), tc.wantErr)
            })
        }
    }
  examples:
    - yourpkg.TestCreateResource
