# Golden fixtures for scout's retrieval tools.
#
# Each fixture calls one tool, marshals the result to JSON, and asserts:
#   - must_include substrings appear in the JSON
#   - must_not_include substrings do not
#   - response size is within max_bytes (when set)
#
# The test indexes scout's own source as the corpus. Symbol IDs below are
# qualified with github.com/urechandro/scout/... to match what the indexer
# produces.

- name: precise_lookup_finds_link_proto_to_go
  tool: get_relevant_context
  args:
    query: LinkProtoToGo
  must_include:
    - github.com/urechandro/scout/indexer.LinkProtoToGo
  max_bytes: 4000

- name: discovery_finds_watcher
  tool: get_relevant_context
  args:
    query: watcher debounce file changes
  must_include:
    - github.com/urechandro/scout/indexer.Watcher
  max_bytes: 12000

- name: empty_result_stays_small
  tool: get_relevant_context
  args:
    query: ZzzNonExistentSymbolXyz999
  must_not_include:
    - "\"id\":"
  max_bytes: 1500

- name: get_flow_accepts_fuzzy_id
  tool: get_flow
  args:
    symbol_id: LinkProtoToGo
  must_include:
    - github.com/urechandro/scout/indexer.LinkProtoToGo
    - "\"callees\""
  max_bytes: 16000

- name: callers_of_link_proto_to_go
  tool: get_callers
  args:
    symbol_id: github.com/urechandro/scout/indexer.LinkProtoToGo
  must_include:
    - github.com/urechandro/scout/cmd/scout
  max_bytes: 4000

- name: callees_of_link_proto_to_go
  tool: get_callees
  args:
    symbol_id: github.com/urechandro/scout/indexer.LinkProtoToGo
  must_include:
    - UpsertEdge
  max_bytes: 4000

- name: simplest_rpc_on_no_rpc_corpus
  tool: get_simplest_rpc
  args:
    service: ""
    limit: 3
  must_include:
    - "\"considered\":0"
    - No implemented RPCs
  max_bytes: 1000

- name: discovery_within_budget
  tool: get_relevant_context
  args:
    query: parse proto messages and rpcs
  max_bytes: 12000

- name: impact_of_upsert_symbol_crosses_packages
  tool: get_impact
  args:
    symbol_id: github.com/urechandro/scout/store.Store.UpsertSymbol
  must_include:
    - github.com/urechandro/scout/protoindexer
    - github.com/urechandro/scout/indexer
  max_bytes: 8000

# Scout's own corpus has no proto RPCs, so this exercises get_pattern's
# FTS-fallback path: when no RPC matches, it returns an Implementation
# slice built from the best Go-symbol hit.
- name: pattern_fallback_returns_implementation
  tool: get_pattern
  args:
    task: upsert symbol
  must_include:
    - "\"implementation\""
    - UpsertSymbol
  max_bytes: 5000

# Scout's own corpus has no proto services, so get_unimplemented must
# return a clear "no service found" error rather than crash or return
# empty silently. This pins that contract.
- name: unimplemented_errors_when_no_service_matches
  tool: get_unimplemented
  args:
    service: ZzzNonExistentService
  want_error: no service found

# --- proto field granularity (corpus: eval/testdata/planning.proto) ---

# Precise lookup of a field by its full dotted ID returns the field line.
- name: field_get_body_precise
  tool: get_body
  args:
    symbol_id: scouteval.v1.ShipmentLeg.scheduled_pickup_time
  must_include:
    - "string scheduled_pickup_time = 2"
    - "\"kind\":\"field\""
  max_bytes: 3000

# Discovery via the field's docstring vocabulary surfaces the field.
- name: field_discovery_via_docstring
  tool: get_relevant_context
  args:
    query: pickup scheduled at origin location
  must_include:
    - scheduled_pickup_time

# Field impact includes the declaring message in the proto layer. The
# corpus has no Go code touching this field, so the proto layer is the
# whole blast radius here.
- name: field_impact_declaring_message
  tool: get_impact
  args:
    symbol_id: scouteval.v1.ShipmentLeg.scheduled_pickup_time
  must_include:
    - "\"proto\""
    - "scouteval.v1.ShipmentLeg\""
  must_not_include:
    - scouteval.v1.CreateLegRequest
  max_bytes: 4000
